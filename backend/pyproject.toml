[project]
name = "sharpz-backend"
version = "0.1.0"
description = "Sharpz V2 backend — FastAPI async pipeline for synthetic buyer panels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Julian Tabacman", email = "julian@sharpzanalytics.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Data + validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyyaml>=6.0.2",

    # DB
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # LLM (via OpenRouter using OpenAI-compatible SDK)
    "openai>=1.54.0",
    "tiktoken>=0.8.0",

    # Async job queue + caching
    "arq>=0.26.0",
    "redis>=5.2.0",

    # HTTP client
    "httpx>=0.27.0",

    # Files / storage
    "pypdf>=5.1.0",         # PDF parsing
    "boto3>=1.35.0",        # R2 via S3-compatible
    "jinja2>=3.1.0",        # deliverable rendering

    # Auth + rate limit
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",

    # Observability
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pre-commit>=4.0.0",
]

local-inference = [
    # GPU local — instalar solo en WSL2 con NVIDIA
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "sentence-transformers>=3.3.0",
    "gliner>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpz"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
